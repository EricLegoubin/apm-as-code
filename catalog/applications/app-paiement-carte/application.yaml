id: app-paiement-carte
name: Paiement carte
aliases: [Monétique]
external_refs:
  - system: servicenow
    ref: APM0001002
summary: Autorise les paiements carte et gère le cycle de vie des cartes.
description: |
  Reçoit les demandes d'autorisation du processeur monétique, contrôle le solde
  auprès de la tenue de compte et répond. Gère commande, activation, opposition
  et plafonds des cartes.
capabilities: [cap-autorisation-carte, cap-gestion-carte]
lifecycle: run
organisation:
  owner: org-tribe-paiement
  maintainer: org-tribe-paiement
  operator: org-team-exploitation
