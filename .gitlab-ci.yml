# Équivalent GitLab du workflow GitHub
image: python:3.12-slim
stages: [validate, publish]

before_script:
  - pip install -q -e .[dev]

validate:
  stage: validate
  script:
    - pytest -q
    - apm validate catalog --format json > findings.json || (apm validate catalog; exit 1)
  artifacts:
    when: always
    paths: [findings.json]

pages:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apm build catalog -o public
  artifacts:
    paths: [public]
