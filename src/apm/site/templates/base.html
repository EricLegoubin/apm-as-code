<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — Portefeuille applicatif</title>
<link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
<header>
  <a class="brand" href="{{ root }}index.html">Portefeuille applicatif</a>
  <nav>
  {% for href, label in NAV %}
    <a href="{{ root }}{{ href }}" class="{{ 'on' if page == href or (page.startswith('apps/') and href == 'index.html') }}">{{ label }}{% if href == 'quality.html' and counts['error'] %} <span class="badge b-error">{{ counts['error'] }}</span>{% endif %}</a>
  {% endfor %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Généré depuis le dépôt — date de référence {{ today.isoformat() }} — <a href="{{ root }}catalog.json">catalog.json</a></footer>
<script type="module">
  const blocks = document.querySelectorAll('.mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'neutral', gantt: { useWidth: 1100, leftPadding: 170, barHeight: 22 } });
    await mermaid.run({ nodes: blocks });
  }
</script>
<script>
  document.querySelectorAll('input.filter').forEach(input => input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    document.querySelectorAll(input.dataset.target + ' tbody tr').forEach(tr =>
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none');
  }));
</script>
</body>
</html>
