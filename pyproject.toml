[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apm-as-code"
version = "0.1.0"
description = "Gestion de portefeuille applicatif à partir de fichiers YAML versionnés"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "Jinja2>=3.1",
  "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apm = "apm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apm = ["site/templates/*.html", "site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
